name: Start Server
run-name: Minecraft local wake request (legacy start-server)
on:
  repository_dispatch:
    types: [start-server]
  workflow_dispatch:
permissions: {}
concurrency:
  group: minecraft-wake-signal
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish local Minecraft wake signal
        run: |
          echo "Legacy start-server now wakes Minecraft on the local PC."
          echo "This workflow does not start Aliyun ECS or SDGO."
          echo "Success is a signal only; the local listener reports actual server readiness."
