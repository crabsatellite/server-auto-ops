name: Sync CodeUp Mirror

on:
  repository_dispatch:
    types: [sync-codeup]
  workflow_dispatch:
    inputs:
      repository_id:
        description: "CodeUp repository ID to sync"
        required: false
        type: string

jobs:
  sync-codeup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Trigger CodeUp mirror sync
        env:
          ALIBABA_ACCESS_KEY_ID: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          ALIBABA_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          CODEUP_ORGANIZATION_ID: ${{ secrets.CODEUP_ORGANIZATION_ID }}
          CODEUP_REPOSITORY_ID: ${{ github.event.client_payload.repository_id || github.event.inputs.repository_id || secrets.CODEUP_MC_REPOSITORY_ID }}
          CODEUP_REPOSITORY_IDS: ${{ secrets.CODEUP_REPOSITORY_IDS }}
          CODEUP_REMOTE_ACCOUNT: ${{ secrets.CODEUP_REMOTE_ACCOUNT }}
          CODEUP_REMOTE_TOKEN: ${{ secrets.CODEUP_REMOTE_TOKEN }}
        run: python scripts/codeup_mirror_sync.py
